<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quicksheet</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="toolbar">
    <button id="import-btn" title="Importar .csv / .xlsx" aria-label="Importar archivo">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="M7 10l5 5 5-5" />
        <path d="M12 15V3" />
      </svg>
    </button>
    <input id="import-input" type="file" accept=".csv,.tsv,.txt,.xlsx" hidden />
    <button id="clear-all-btn" title="Borrar todo" aria-label="Borrar todo">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18" />
        <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
        <path d="M10 11v6M14 11v6" />
      </svg>
    </button>
    <button id="zoom-indicator" title="Clic para restablecer al 100%">100%</button>
    <button id="settings-btn" title="Configuración" aria-label="Configuración">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
    </div>
    <div id="settings-panel" class="hidden">
      <label for="shortcut-input">Atajo global (mostrar/ocultar)</label>
      <input id="shortcut-input" type="text" spellcheck="false" autocomplete="off" placeholder="Ctrl+Alt+E" />
      <div id="settings-actions">
        <button id="shortcut-save">Guardar</button>
        <button id="settings-close">Cerrar</button>
      </div>
      <p id="shortcut-status"></p>
    </div>
    <div id="formula-bar">
      <div id="formula-bar-addr"></div>
      <input id="formula-bar-input" type="text" spellcheck="false" autocomplete="off" />
    </div>
    <div id="grid-container">
      <table id="grid"></table>
    </div>
  </body>
</html>
